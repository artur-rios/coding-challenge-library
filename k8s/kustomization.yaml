apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: library

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: library-api
  app.kubernetes.io/part-of: library

images:
  - name: library-api
    newTag: latest
