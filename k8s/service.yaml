apiVersion: v1
kind: Service
metadata:
  name: library-api
  namespace: library
  labels:
    app.kubernetes.io/name: library-api
    app.kubernetes.io/component: api
spec:
  # ClusterIP: the API is reached through whatever Ingress or gateway the cluster runs, not exposed
  # directly. Nothing here authenticates, so putting it on a LoadBalancer would publish an unguarded
  # write API to the internet.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: library-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
