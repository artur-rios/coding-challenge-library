apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
  namespace: library
  labels:
    app.kubernetes.io/name: library-api
    app.kubernetes.io/component: api
spec:
  # Two, not one. The API is designed to run several replicas - every write path is guarded by a
  # conditional update or a unique index rather than by in-process state - and running a single
  # replica in production would mean that property is never actually exercised until the day it has
  # to be. The HorizontalPodAutoscaler takes it from here to eleven.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: library-api
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # No replica is taken down before its replacement is ready, so a rollout never dips below the
      # configured capacity.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The Job in migration-job.yaml is what normally applies migrations. This container is the
      # second line: it blocks the pod from starting until the schema actually has the latest
      # migration, so a Deployment applied before its Job cannot serve traffic against a schema that
      # does not match the code.
      initContainers:
        - name: wait-for-schema
          image: library-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          env:
            - name: LIBRARY_RUN_MIGRATIONS
              value: "true"
            - name: LIBRARY_DATA_CONNECTIONSTRING
              valueFrom:
                secretKeyRef:
                  name: library-api-secrets
                  key: LIBRARY_DATA_CONNECTIONSTRING
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: library-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-api-config
            - secretRef:
                name: library-api-secrets
          # Requests are what the scheduler packs by and what the HPA measures against; limits are
          # the ceiling. Memory's request and limit are equal on purpose - that gives the pod the
          # Guaranteed QoS class for memory, so it is not the first thing evicted when a node comes
          # under pressure. CPU's limit is higher than its request because CPU is compressible: a
          # burst is throttled, not killed.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          # Liveness runs no dependency checks at all: it answers as long as the process is up. A
          # liveness probe that reached PostgreSQL would turn a database outage into a restart loop
          # across every replica, which cannot help and actively hinders recovery.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness checks the dependencies needed to serve traffic. Redis reports Degraded rather
          # than Unhealthy, so a Redis outage slows the API down without taking any pod out of the
          # Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Gives a slow-starting pod time to come up without the liveness probe killing it, while
          # keeping the liveness period short once it is running.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
