# Committed for its shape only. Every value here is a placeholder, and applying this file as it
# stands gives an API that cannot reach its database - deliberately, because the alternative is a
# repository that carries a credential.
#
# Supply the real values out of band; k8s/README.md has the command. In a real cluster this object
# would be produced by an External Secrets Operator or a CSI secret driver rather than applied by
# hand, so the credential never exists as a Kubernetes object at all.
apiVersion: v1
kind: Secret
metadata:
  name: library-api-secrets
  namespace: library
  labels:
    app.kubernetes.io/name: library-api
type: Opaque
stringData:
  # No search path is pinned: every table the model owns is schema-qualified by the model, and the
  # migrations history table is qualified to public - so nothing here resolves through "$user".
  LIBRARY_DATA_CONNECTIONSTRING: "Host=CHANGE_ME;Port=5432;Database=library;Username=CHANGE_ME;Password=CHANGE_ME"
  LIBRARY_REDIS_CONNECTIONSTRING: "CHANGE_ME:6379"
